name: Verify Axyon Control build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: postgresql://example:example@localhost:5432/axyon
          DIRECT_URL: postgresql://example:example@localhost:5432/axyon
          NEXTAUTH_SECRET: ci-only-placeholder-do-not-use-in-production
          AUTH_SECRET: ci-only-placeholder-do-not-use-in-production
          ENCRYPTION_MASTER_KEY: ci-only-not-production-0123456789abcdef
          NEXTAUTH_URL: http://localhost:3000
